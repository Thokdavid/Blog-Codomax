<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blog Codomax</title>
    <link rel="shortcut icon" href="assets/images/Logo.JPG" sizes="48x48">
    <link rel="icon" href="assets/images/Logo.JPG" sizes="48x48">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/images/Logo.JPG" alt="Blog Codomax Logo" class="logo-img">
                Blog Codomax
            </a>
            <a href="index.html" class="btn btn-outline hidden-mobile">Home</a>
        </div>
    </nav>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <img src="assets/images/Logo.JPG" alt="Blog Codomax Logo" class="logo-img">
                    Blog Codomax
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to your account to continue writing and reading.</p>
            </div>

            <div id="loginAlert" class="alert alert-error" style="display: none;"></div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2.2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 17a2 2 0 100-4 2 2 0 000 4zm6-9h-1V6c0-2.76-2.24-5-5-5S5 3.24 5 6v2H6c1.65 0 3 1.35 3 3v5h6v-5c0-1.65 1.35-3 3-3zm-6-3.05c1.62 0 3 .17 3 1.72V8h-6V6.67c0-1.51 1.38-1.72 3-1.72z"/>
                        </svg>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group" style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; align-items:center; gap:0.5rem;">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember" style="margin-bottom:0; font-weight:400;">Remember me</label>
                    </div>
                    <a href="#" style="color: var(--primary); font-size:0.85rem;">Forgot password?</a>
                </div>

                <button type="submit" class="btn-auth">
                    Sign In
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M13 9l3 3-3 3V9z"/>
                        <path d="M6 9h12v2H6z"/>
                    </svg>
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create Account</a>
            </div>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
