        <polygon points="120,200 140,200 130,180" fill="rgba(255,255,255,0.5)" />
        <polygon points="200,190 225,190 212,170" fill="rgba(255,255,255,0.6)" />
        <polygon points="280,210 310,210 295,185" fill="rgba(255,255,255,0.4)" />
