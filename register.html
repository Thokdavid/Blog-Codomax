<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Blog Codomax</title>
    <link rel="shortcut icon" href="assets/images/Logo.JPG" sizes="48x48">
    <link rel="icon" href="assets/images/Logo.JPG" sizes="48x48">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/images/Logo.JPG" alt="Blog Codomax Logo" class="logo-img">
                Blog Codomax
            </a>
            <a href="index.html" class="btn btn-outline hidden-mobile">Home</a>
        </div>
    </nav>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <img src="assets/images/Logo.JPG" alt="Blog Codomax Logo" class="logo-img">
                    Blog Codomax
                </div>
                <h2>Create Your Account</h2>
                <p>Join Blog Codomax to start writing, sharing, and connecting with readers.</p>
            </div>

            <div id="registerAlert" class="alert alert-error" style="display: none;"></div>

            <form class="auth-form" id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-with-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2.2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>
                            <input type="text" id="firstName" name="firstName" placeholder="Jane" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-with-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2.2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>
                            <input type="text" id="lastName" name="lastName" placeholder="Smith" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M22 8V4c0-1.1-.9-2-2-2H4C2.9 2 2 2.9 2 4v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8l-2-2h-2zm0 4l-2 2v6H4V8l2-2h10l2 2z"/>
                        </svg>
                        <input type="email" id="registerEmail" name="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2.2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                        <input type="text" id="username" name="username" placeholder="janewrites" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <div class="input-with-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 17a2 2 0 100-4 2 2 0 000 4zm6-9h-1V6c0-2.76-2.24-5-5-5S5 3.24 5 6v2H6c1.65 0 3 1.35 3 3v5h6v-5c0-1.65 1.35-3 3-3zm-6-3.05c1.62 0 3 .17 3 1.72V8h-6V6.67c0-1.51 1.38-1.72 3-1.72z"/>
                        </svg>
                        <input type="password" id="registerPassword" name="password" placeholder="At least 8 characters" required>
                    </div>
                </div>

                <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms" style="margin-bottom:0; font-weight:400; font-size:0.9rem;">
                        I agree to the <a href="#" style="color: var(--primary);">Terms of Service</a> and <a href="#" style="color: var(--primary);">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn-auth">
                    Create Account
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M13 9l3 3-3 3V9z"/>
                        <path d="M6 9h12v2H6z"/>
                    </svg>
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
